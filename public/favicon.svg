<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Classic soccer ball: white ball with black pentagon patches -->
  <circle cx="32" cy="32" r="30" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Central pentagon -->
  <polygon points="32.0,22.5 41.04,29.06 37.58,39.69 26.42,39.69 22.96,29.06" fill="#1e293b"/>
  <!-- Spokes from central pentagon to the edge -->
  <path d="M 32.0,22.5 L 32.0,3.5
           M 41.04,29.06 L 59.11,23.19
           M 37.58,39.69 L 48.75,55.06
           M 26.42,39.69 L 15.25,55.06
           M 22.96,29.06 L 4.89,23.19"
        stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Edge pentagons -->
  <polygon points="48.75,8.94 32.0,10.0 23.77,20.67 45.31,36.33 52.92,25.2" fill="#1e293b"/>
  <polygon points="59.11,40.81 52.92,25.2 40.23,20.67 32.0,46.0 44.93,49.8" fill="#1e293b"/>
  <polygon points="32.0,60.5 44.93,49.8 45.31,36.33 18.69,36.33 19.07,49.8" fill="#1e293b"/>
  <polygon points="4.89,40.81 19.07,49.8 32.0,46.0 23.77,20.67 11.08,25.2" fill="#1e293b"/>
  <polygon points="15.25,8.94 11.08,25.2 18.69,36.33 40.23,20.67 32.0,10.0" fill="#1e293b"/>
</svg>